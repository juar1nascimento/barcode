name: GTI SESA - isolated Drive lease migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261013130000_gti_drive_folder_lease.sql"
      - ".github/workflows/gti-drive-folder-migration-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-drive-folder-lease-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gti_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gti_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: gti_migration_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Prepare isolated Supabase role names
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL

      - name: Apply migration to disposable PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261013130000_gti_drive_folder_lease.sql

      - name: Verify lease acquire, renew, token isolation and release
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            v_id bigint := 987654321;
            v_token uuid := '11111111-1111-4111-8111-111111111111';
            v_other_token uuid := '22222222-2222-4222-8222-222222222222';
          BEGIN
            IF NOT public.gti_acquire_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'lease acquisition unexpectedly failed';
            END IF;
            IF public.gti_renew_drive_folder_lease(v_id, v_other_token, 60) THEN
              RAISE EXCEPTION 'renewal accepted a mismatched token';
            END IF;
            IF NOT public.gti_renew_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'valid lease renewal failed';
            END IF;
            IF public.gti_acquire_drive_folder_lease(v_id, v_other_token, 60) THEN
              RAISE EXCEPTION 'second lease acquisition unexpectedly succeeded';
            END IF;
            IF NOT public.gti_release_drive_folder_lease(v_id, v_token) THEN
              RAISE EXCEPTION 'lease release failed';
            END IF;
            IF public.gti_renew_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'renewal succeeded after release';
            END IF;
          END
          $test$;
          SQL

      - name: Verify expiry recovery and token-guarded release
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            v_id bigint := 987654322;
            v_token uuid := '33333333-3333-4333-8333-333333333333';
            v_new_token uuid := '44444444-4444-4444-8444-444444444444';
            v_wrong_token uuid := '55555555-5555-4555-8555-555555555555';
          BEGIN
            IF NOT public.gti_acquire_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'initial lease acquisition failed';
            END IF;
            IF public.gti_release_drive_folder_lease(v_id, v_wrong_token) THEN
              RAISE EXCEPTION 'release accepted a mismatched token';
            END IF;
            IF NOT public.gti_renew_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'wrong-token release changed the current lease';
            END IF;

            UPDATE public.gti_drive_folder_leases
               SET lease_until = clock_timestamp() - interval '1 second'
             WHERE patrimonio_id = v_id AND lease_token = v_token;
            IF NOT FOUND THEN
              RAISE EXCEPTION 'could not expire the test lease';
            END IF;
            IF NOT public.gti_acquire_drive_folder_lease(v_id, v_new_token, 60) THEN
              RAISE EXCEPTION 'expired lease could not be reacquired';
            END IF;
            IF public.gti_release_drive_folder_lease(v_id, v_token) THEN
              RAISE EXCEPTION 'former owner released the replacement lease';
            END IF;
            IF NOT public.gti_renew_drive_folder_lease(v_id, v_new_token, 60) THEN
              RAISE EXCEPTION 'former owner affected the replacement lease';
            END IF;
            IF NOT public.gti_release_drive_folder_lease(v_id, v_new_token) THEN
              RAISE EXCEPTION 'replacement lease release failed';
            END IF;
          END
          $test$;
          SQL

      - name: Verify simultaneous acquisition from two PostgreSQL sessions
        run: |
          set -euo pipefail
          psql -Atq -v ON_ERROR_STOP=1 -c "SELECT public.gti_acquire_drive_folder_lease(987654323, '66666666-6666-4666-8666-666666666666', 60)" > /tmp/lease_a.out &
          pid_a=$!
          psql -Atq -v ON_ERROR_STOP=1 -c "SELECT public.gti_acquire_drive_folder_lease(987654323, '77777777-7777-4777-8777-777777777777', 60)" > /tmp/lease_b.out &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          result_a="$(tr -d '[:space:]' < /tmp/lease_a.out)"
          result_b="$(tr -d '[:space:]' < /tmp/lease_b.out)"
          if ! { [[ "$result_a" == "t" && "$result_b" == "f" ]] || [[ "$result_a" == "f" && "$result_b" == "t" ]]; }; then
            echo "Expected exactly one lease owner; session A='$result_a', session B='$result_b'"
            exit 1
          fi
          if [[ "$result_a" == "t" ]]; then
            psql -v ON_ERROR_STOP=1 -c "SELECT public.gti_release_drive_folder_lease(987654323, '66666666-6666-4666-8666-666666666666')" >/dev/null
          else
            psql -v ON_ERROR_STOP=1 -c "SELECT public.gti_release_drive_folder_lease(987654323, '77777777-7777-4777-8777-777777777777')" >/dev/null
          fi

      - name: Verify restricted function execution grants
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          BEGIN
            IF has_function_privilege('anon', 'public.gti_acquire_drive_folder_lease(bigint,uuid,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon can execute lease acquisition';
            END IF;
            IF has_function_privilege('authenticated', 'public.gti_renew_drive_folder_lease(bigint,uuid,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated can execute lease renewal';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.gti_renew_drive_folder_lease(bigint,uuid,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role cannot execute lease renewal';
            END IF;
          END
          $test$;
          SQL
