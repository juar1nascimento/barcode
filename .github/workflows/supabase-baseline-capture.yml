name: Supabase Baseline Capture

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/supabase-source-of-truth

permissions:
  contents: read

concurrency:
  group: supabase-baseline-capture
  cancel-in-progress: true

jobs:
  baseline:
    name: Capture remote schema as migration baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Missing required GitHub Actions secret: SUPABASE_DB_URL"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Show CLI version
        run: supabase --version

      - name: Verify db pull diff-engine support
        shell: bash
        run: |
          set -euo pipefail
          supabase db pull --help | grep -F -- "--diff-engine"

      # The first baseline was already recorded remotely, but its generated
      # SQL was rejected because the legacy diff path proposed a destructive
      # extension drop. Temporarily remove only that history marker so db pull
      # can regenerate the baseline with pg-delta; db pull restores the marker.
      - name: Reopen one-time baseline capture
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair 20260927143219 --status reverted --db-url "$SUPABASE_DB_URL"

      - name: Capture remote baseline with pg-delta
        shell: bash
        run: |
          set -euo pipefail
          supabase db pull --diff-engine pg-delta --db-url "$SUPABASE_DB_URL"

      - name: Validate generated baseline
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(supabase/migrations/*_remote_schema.sql)
          if [ "${#migrations[@]}" -ne 1 ]; then
            echo "Expected exactly one generated *_remote_schema.sql baseline; found ${#migrations[@]}."
            printf '%s\n' "${migrations[@]:-<none>}"
            exit 1
          fi

          baseline="${migrations[0]}"
          test -s "$baseline"
          echo "Generated baseline: $baseline"

          forbidden='(^|[[:space:];])(DROP[[:space:]]+(TABLE|SCHEMA|DATABASE|INDEX|FUNCTION|TRIGGER|EXTENSION)|TRUNCATE[[:space:]]+|INSERT[[:space:]]+INTO|COPY[[:space:]]+|ALTER[[:space:]]+TABLE[[:space:]]+.*DROP[[:space:]]+CONSTRAINT)'
          if grep -Eiq "$forbidden" "$baseline"; then
            echo "Baseline contains a forbidden destructive/data statement."
            grep -Ein "$forbidden" "$baseline" || true
            exit 1
          fi

          for table in unidades setores patrimonios patrimonio_fotos; do
            if ! grep -Eiq "CREATE[[:space:]]+TABLE.*public.*${table}" "$baseline"; then
              echo "Baseline is missing expected public table: $table"
              exit 1
            fi
          done

          echo "Baseline passed destructive/data-statement and completeness guards."

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-baseline-migration
          path: supabase/migrations/*_remote_schema.sql
          if-no-files-found: error
          retention-days: 14
