name: Auditar gerenciamento de exclusao

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_gerenciamento_exclusao_fix.py'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correcao
        run: python scripts/apply_gerenciamento_exclusao_fix.py

      - name: Validar sintaxe
        run: |
          python -m py_compile sistema_inventario.py
          python -m py_compile Tabela_de_dados_Inventario_7_2.py

      - name: Simular exclusoes
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.DataFrame([
              {'Setor': 'Recepção', 'CPU - Nº de Patrimônio': 'CPU-001', 'Fabricante CPU': 'Dell', 'Monitores - Nº de Patrimônio': 'MON-001', 'Fabricante Monitores': 'Samsung'},
              {'Setor': 'recepção', 'CPU - Nº de Patrimônio': 'CPU-002', 'Fabricante CPU': 'HP', 'Monitores - Nº de Patrimônio': '', 'Fabricante Monitores': ''},
              {'Setor': 'Odontologia', 'CPU - Nº de Patrimônio': 'CPU-003', 'Fabricante CPU': 'Lenovo', 'Monitores - Nº de Patrimônio': '', 'Fabricante Monitores': ''},
          ])

          mask = df['Setor'].astype(str).str.strip().str.casefold() == 'recepção'
          assert mask.sum() == 2
          assert len(df.loc[~mask]) == 1

          df2 = df.copy().astype(str)
          mask2 = df2['Setor'].str.strip().str.casefold() == 'recepção'
          df2.loc[mask2, 'Monitores - Nº de Patrimônio'] = ''
          df2.loc[mask2, 'Fabricante Monitores'] = ''
          assert df2.loc[0, 'CPU - Nº de Patrimônio'] == 'CPU-001'
          assert df2.loc[0, 'Fabricante CPU'] == 'Dell'
          assert df2.loc[0, 'Monitores - Nº de Patrimônio'] == ''
          assert df2.loc[0, 'Fabricante Monitores'] == ''

          df3 = df.copy().astype(str)
          mask3 = df3['Setor'].str.strip().str.casefold() == 'odontologia'
          df3.loc[mask3, 'CPU - Nº de Patrimônio'] = ''
          df3.loc[mask3, 'Fabricante CPU'] = ''
          cols = [c for c in df3.columns if c != 'Setor']
          vazia = df3[cols].apply(lambda row: all(str(v).strip() == '' for v in row), axis=1)
          df3 = df3.loc[~vazia]
          assert 'Odontologia' not in df3['Setor'].tolist()
          print('SIMULACAO_OK')
          PY

      - name: Gravar correcao e limpar arquivos temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sistema_inventario.py Tabela_de_dados_Inventario_7_2.py
          git rm .github/workflows/auditar-gerenciamento-exclusao.yml scripts/apply_gerenciamento_exclusao_fix.py
          git commit -m "Otimizar gerenciamento de exclusao"
          git push
