name: Auditar gerenciamento de exclusao

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply_gerenciamento_exclusao_fix.py'

permissions:
  contents: write

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar correcao
        run: python scripts/apply_gerenciamento_exclusao_fix.py

      - name: Validar sintaxe
        run: |
          python -m py_compile sistema_inventario.py
          python -m py_compile Tabela_de_dados_Inventario_7_2.py

      - name: Simular exclusoes em memoria
        run: |
          python - <<'PY'
          rows = [
              {'Setor': 'Recepção', 'CPU': 'CPU-001', 'Fabricante CPU': 'Dell', 'Monitor': 'MON-001', 'Fabricante Monitor': 'Samsung'},
              {'Setor': 'recepção', 'CPU': 'CPU-002', 'Fabricante CPU': 'HP', 'Monitor': '', 'Fabricante Monitor': ''},
              {'Setor': 'Odontologia', 'CPU': 'CPU-003', 'Fabricante CPU': 'Lenovo', 'Monitor': '', 'Fabricante Monitor': ''},
          ]

          setor = 'recepção'.casefold()
          apos_setor = [r for r in rows if r['Setor'].strip().casefold() != setor]
          assert len(apos_setor) == 1 and apos_setor[0]['Setor'] == 'Odontologia'

          rows2 = [dict(r) for r in rows]
          for r in rows2:
              if r['Setor'].strip().casefold() == setor:
                  r['Monitor'] = ''
                  r['Fabricante Monitor'] = ''
          assert rows2[0]['CPU'] == 'CPU-001' and rows2[0]['Fabricante CPU'] == 'Dell'
          assert rows2[0]['Monitor'] == '' and rows2[0]['Fabricante Monitor'] == ''

          rows3 = [dict(r) for r in rows]
          for r in rows3:
              if r['Setor'].strip().casefold() == 'odontologia':
                  r['CPU'] = ''
                  r['Fabricante CPU'] = ''
          rows3 = [r for r in rows3 if any(str(v).strip() for k, v in r.items() if k != 'Setor')]
          assert all(r['Setor'] != 'Odontologia' for r in rows3)
          print('SIMULACAO_OK')
          PY

      - name: Gravar correcao e limpar arquivos temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sistema_inventario.py Tabela_de_dados_Inventario_7_2.py
          git rm .github/workflows/auditar-gerenciamento-exclusao.yml scripts/apply_gerenciamento_exclusao_fix.py
          git commit -m "Otimizar gerenciamento de exclusao"
          git push
