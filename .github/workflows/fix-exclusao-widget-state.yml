name: Corrigir estado do Gerenciador de Exclusao

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/fix_exclusao_widget_state.py'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        run: python scripts/fix_exclusao_widget_state.py
      - name: Validar sintaxe
        run: python -m py_compile sistema_inventario.py
      - name: Gravar e limpar temporarios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sistema_inventario.py
          git rm .github/workflows/fix-exclusao-widget-state.yml scripts/fix_exclusao_widget_state.py
          git commit -m "Corrigir estado dos menus apos exclusao"
          git push
