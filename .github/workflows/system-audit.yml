name: System Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Python and inventory smoke audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run backend functional simulations
        run: pytest -q tests/test_inventario_backend.py

      - name: Streamlit startup smoke test
        shell: bash
        run: |
          set -e
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit startup OK"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log
          exit 1
