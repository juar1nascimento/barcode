name: Recover inventory backend after safe diagnostic edit
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    if: github.event.head_commit.message != 'Restaurar backend completo do inventário'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore backend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert --no-edit 94988e88e32e5edc1a4b5205ddbbcf91d0b148ed
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/recover-backend.yml
          git commit -m "Remover workflow temporario de recuperacao"
          git push
