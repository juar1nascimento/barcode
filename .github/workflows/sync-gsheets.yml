name: Inventário GTI SESA - Google Sheets Sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: inventory-gsheets-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Validate sync configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.GTI_DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
      SUPABASE_POOLER_HOST: aws-0-sa-east-1.pooler.supabase.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile synchronization workers
        run: |
          python -m py_compile inventario_sheets_outbox_worker.py
          python -m py_compile sheets_outbox_worker.py
      - name: Validate required secrets without exposing values
        run: |
          python - <<'PY'
          import os
          import psycopg

          required = [
              "DATABASE_URL",
              "GOOGLE_SERVICE_ACCOUNT_JSON",
              "GOOGLE_SPREADSHEET_ID",
          ]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          if missing:
              raise SystemExit("Secrets GTI ausentes: " + ", ".join(missing))

          database = os.environ["DATABASE_URL"].strip()
          from psycopg.conninfo import conninfo_to_dict

          try:
              params = conninfo_to_dict(database)
          except Exception as exc:
              raise SystemExit("GTI_DATABASE_URL possui formato inválido; use uma URI PostgreSQL válida. Tipo técnico: " + type(exc).__name__ + ".")

          host = params.get("host", "")
          if not host:
              raise SystemExit("GTI_DATABASE_URL possui formato inválido; informe o host PostgreSQL.")
          candidates = [("primary", database)]

          project_ref = ""
          if host.startswith("db.") and host.endswith(".supabase.co"):
              project_ref = host[3:-len(".supabase.co")]
          if project_ref:
              pooler_params = dict(params)
              if pooler_params.get("user") == "postgres":
                  pooler_params["user"] = f"postgres.{project_ref}"
              pooler_params["host"] = os.environ["SUPABASE_POOLER_HOST"]
              pooler_params["port"] = 6543
              candidates.append(("supabase-pooler", pooler_params))
          failures = []
          for label, candidate in candidates:
              try:
                  if isinstance(candidate, dict):
                      print(f"Teste PostgreSQL [{label}]: host={candidate.get('host')}, port={candidate.get('port',5432)}, database={candidate.get('dbname','postgres')}, user_configured={bool(candidate.get('user'))}.")
                      with psycopg.connect(**candidate, connect_timeout=8) as conn:
                          with conn.cursor() as cur:
                              cur.execute("SELECT 1")
                              cur.fetchone()
                  else:
                      print(f"Teste PostgreSQL [{label}]: host={params.get('host')}, port={params.get('port',5432)}, database={params.get('dbname','postgres')}, user_configured={bool(params.get('user'))}.")
                      with psycopg.connect(candidate, connect_timeout=8) as conn:
                          with conn.cursor() as cur:
                              cur.execute("SELECT 1")
                              cur.fetchone()
                  if label == "supabase-pooler":
                      print("Conexão PostgreSQL validada pelo pooler IPv4 do Supabase.")
                  else:
                      print("Conexão PostgreSQL validada sem exibir valores sensíveis.")
                  break
              except Exception as exc:
                  sqlstate = getattr(exc, "sqlstate", None)
                  failures.append(f"{label}:{type(exc).__name__}" + (f"/SQLSTATE={sqlstate}" if sqlstate else ""))
          else:
              raise SystemExit("GTI_DATABASE_URL não pôde ser conectada; diagnóstico seguro: " + ", ".join(failures))
      - name: Validate no hardcoded secret patterns
        run: |
          ! git grep -nE 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|postgresql://[^[:space:]]+:[^[:space:]]+@|AIza[0-9A-Za-z_-]{20,}' -- ':!tests/**' ':!.github/workflows/**'

  sync-patrimonios:
    name: Sync patrimonies
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.GTI_DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_MAX_ATTEMPTS: "8"
      SUPABASE_POOLER_HOST: aws-0-sa-east-1.pooler.supabase.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          from psycopg.conninfo import conninfo_to_dict, make_conninfo

          value = os.environ["DATABASE_URL"].strip()
          params = conninfo_to_dict(value)
          host = params.get("host", "")
          if host.startswith("db.") and host.endswith(".supabase.co"):
              project_ref = host[3:-len(".supabase.co")]
              if params.get("user") == "postgres":
                  params["user"] = f"postgres.{project_ref}"
              params["host"] = os.environ["SUPABASE_POOLER_HOST"]
              params["port"] = 6543
              value = make_conninfo(**params)
              print(f"::add-mask::{value}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"DATABASE_URL={value}\n")
      - name: Process patrimony outbox
        run: python inventario_sheets_outbox_worker.py

  sync-fotos:
    name: Sync photos and renew signed URLs
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.GTI_DATABASE_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
      SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GTI_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_POOLER_HOST: aws-0-sa-east-1.pooler.supabase.com
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_MAX_ATTEMPTS: "8"
      SHEETS_RENEWAL_MAX_ROWS: "5000"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate photo synchronization secrets without exposing values
        run: |
          test -n "${SUPABASE_URL}" || {
            echo "::error::Secret GTI_SUPABASE_URL não configurado; sincronização de fotos permanece bloqueada por segurança."
            exit 1
          }
          case "${SUPABASE_URL}" in
            https://*|http://*) ;;
            *) echo "::error::Secret GTI_SUPABASE_URL inválido."; exit 1 ;;
          esac
          test -n "${SUPABASE_SERVICE_ROLE_KEY}" || {
            echo "::error::Secret GTI_SUPABASE_SERVICE_ROLE_KEY não configurado; sincronização de fotos permanece bloqueada por segurança."
            exit 1
          }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare PostgreSQL connection
        run: |
          python - <<'PY'
          import os
          from psycopg.conninfo import conninfo_to_dict, make_conninfo

          value = os.environ["DATABASE_URL"].strip()
          params = conninfo_to_dict(value)
          host = params.get("host", "")
          if host.startswith("db.") and host.endswith(".supabase.co"):
              project_ref = host[3:-len(".supabase.co")]
              if params.get("user") == "postgres":
                  params["user"] = f"postgres.{project_ref}"
              params["host"] = os.environ["SUPABASE_POOLER_HOST"]
              params["port"] = 6543
              value = make_conninfo(**params)
              print(f"::add-mask::{value}")
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"DATABASE_URL={value}\n")
      - name: Process photo outbox
        run: python sheets_outbox_worker.py
