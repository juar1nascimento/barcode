name: Inventário GTI SESA - Google Sheets Sync

on:
  workflow_dispatch:
  # O Drive roda nos minutos múltiplos de cinco; o Sheets começa dois minutos depois.
  # Frequência mínima do GitHub Actions: cinco minutos. Outbox mantém a entrega idempotente.
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: inventory-gsheets-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Validate sync configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GTI_DB_HOST: ${{ secrets.GTI_DB_HOST }}
      GTI_DB_NAME: ${{ secrets.GTI_DB_NAME }}
      GTI_DB_USER: ${{ secrets.GTI_DB_USER }}
      GTI_DB_PASSWORD: ${{ secrets.GTI_DB_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_MAX_ATTEMPTS: "12"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile synchronization workers
        run: |
          python -m py_compile inventario_sheets_outbox_worker.py
          python -m py_compile sheets_outbox_worker.py
      - name: Validate required secrets without exposing values
        run: python scripts/validate_gti_sync.py
      - name: Validate no hardcoded secret patterns
        run: |
          ! git grep -nE 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|postgresql://[^[:space:]]+:[^[:space:]]+@|AIza[0-9A-Za-z_-]{20,}|sb_secret_[A-Za-z0-9_-]+' -- ':!tests/**' ':!.github/workflows/**'
      - name: Prepare PostgreSQL connection
        run: python scripts/prepare_gti_database.py
      - name: Process patrimony outbox
        run: python inventario_sheets_outbox_worker.py

  sync-fotos:
    name: Sync photos to Drive links
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GTI_DB_HOST: ${{ secrets.GTI_DB_HOST }}
      GTI_DB_NAME: ${{ secrets.GTI_DB_NAME }}
      GTI_DB_USER: ${{ secrets.GTI_DB_USER }}
      GTI_DB_PASSWORD: ${{ secrets.GTI_DB_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
      GTI_SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL }}
      GTI_SUPABASE_SECRET_KEY: ${{ secrets.GTI_SUPABASE_SECRET_KEY }}
      OUTBOX_BATCH_SIZE: "20"
      OUTBOX_MAX_ATTEMPTS: "12"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare PostgreSQL connection
        run: python scripts/prepare_gti_database.py
      - name: Process up to five Drive outbox items before Sheets photo links
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GTI_SUPABASE_URL}" || { echo "::error::GTI_SUPABASE_URL não configurado."; exit 1; }
          test -n "${GTI_SUPABASE_SECRET_KEY}" || { echo "::error::GTI_SUPABASE_SECRET_KEY não configurado."; exit 1; }
          case "${GTI_SUPABASE_URL}" in
            https://*.supabase.co) ;;
            *) echo "::error::GTI_SUPABASE_URL inválido."; exit 1 ;;
          esac
          case "${GTI_SUPABASE_SECRET_KEY}" in
            sb_secret_*) ;;
            *) echo "::error::GTI_SUPABASE_SECRET_KEY não está no formato esperado."; exit 1 ;;
          esac

          preflight_status="$(curl --silent --show-error --max-time 120 --request POST \
            --url "${GTI_SUPABASE_URL}/functions/v1/outbox-drive-worker" \
            --header "Authorization: Bearer ${GTI_SUPABASE_SECRET_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"mode":"validate_drive","limit":1}' \
            --output /tmp/gti-drive-preflight.json --write-out '%{http_code}')"
          echo "DRIVE_PREFLIGHT_HTTP_STATUS=${preflight_status}"
          cat /tmp/gti-drive-preflight.json
          test "${preflight_status}" -ge 200 && test "${preflight_status}" -lt 300
          jq -e '.ok == true and .mode == "validate_drive" and .external_write == false' /tmp/gti-drive-preflight.json

          process_status="$(curl --silent --show-error --max-time 240 --request POST \
            --url "${GTI_SUPABASE_URL}/functions/v1/outbox-drive-worker" \
            --header "Authorization: Bearer ${GTI_SUPABASE_SECRET_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"mode":"process","limit":5}' \
            --output /tmp/gti-drive-process.json --write-out '%{http_code}')"
          echo "DRIVE_PROCESS_HTTP_STATUS=${process_status}"
          cat /tmp/gti-drive-process.json
          test "${process_status}" -ge 200 && test "${process_status}" -lt 300
          jq -e '.ok == true and .mode == "process" and .claimed_changes <= 5 and .synced_changes <= 5' /tmp/gti-drive-process.json
          jq -r '"DRIVE_RESULT: claimed=" + ((.claimed_changes // 0)|tostring) + " synced=" + ((.synced_changes // 0)|tostring) + " failed=" + (([.results[]? | select(.status == "failed")]|length)|tostring)' /tmp/gti-drive-process.json
          if jq -e '([.results[]? | select(.status == "failed")] | length) > 0' /tmp/gti-drive-process.json >/dev/null; then
            echo "::warning::O Drive Worker reportou falha em um item; o worker do Sheets ainda tentará sincronizar links já disponíveis e reagendará dependências pendentes."
          fi

      - name: Process photo outbox
        run: python sheets_outbox_worker.py
