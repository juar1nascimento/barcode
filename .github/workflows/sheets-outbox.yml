name: Sincronizacao de fotos com Google Sheets

on:
  workflow_dispatch:
  push:
    paths:
      - "sheets_outbox_worker.py"
      - ".github/workflows/sheets-outbox.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: gti-sheets-photo-outbox
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg[binary]==3.2.10 gspread==5.12.4 google-auth==2.57.0 requests==2.34.2

      - name: Validar worker antes de acessar dados
        run: python -m py_compile sheets_outbox_worker.py

      - name: Validar configuração sem expor segredos
        env:
          DATABASE_URL: ${{ secrets.GTI_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          value = os.getenv("DATABASE_URL", "").strip()
          parsed = urlparse(value)
          if parsed.scheme not in ("postgresql", "postgres") or not parsed.netloc:
              raise SystemExit("GTI_DATABASE_URL ausente ou inválida: configure uma connection string PostgreSQL completa no GitHub Secrets.")
          print("GTI_DATABASE_URL: formato válido (conteúdo não será exibido).")
          PY
      - name: Processar outbox
        env:
          DATABASE_URL: ${{ secrets.GTI_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
          SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.GTI_SUPABASE_SERVICE_ROLE_KEY }}
          OUTBOX_BATCH_SIZE: "20"
          SHEETS_RENEWAL_MAX_ROWS: "5000"
        run: python sheets_outbox_worker.py


      - name: Relatar resultado
        if: always()
        run: echo "Worker finalizado. Consulte os logs desta execução para quantidade processada e falhas."
