name: Corrigir testes de integridade
on:
  push:
    branches: [main]
    paths: ['.github/workflows/corrigir-testes-integridade.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Ajustar testes e saneamento
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_inventario_backend.py'); s=p.read_text(encoding='utf-8')
          old='''def _mock_persistencia(monkeypatch, estado):\n    monkeypatch.setattr(backend, "carregar_dados_excel", lambda unidade: (estado["df"].copy(), "teste"))\n    monkeypatch.setattr(backend, "salvar_no_excel", lambda df, unidade: estado.__setitem__("df", df.copy()) or True)\n'''
          new='''def _mock_persistencia(monkeypatch, estado):\n    monkeypatch.setattr(backend, "carregar_dados_excel", lambda unidade: (estado["df"].copy(), "teste"))\n    monkeypatch.setattr(backend, "salvar_no_excel", lambda df, unidade: estado.__setitem__("df", df.copy()) or True)\n    monkeypatch.setattr(backend, "_anexar_no_google", lambda df, unidade: estado.__setitem__("df", pd.concat([estado["df"], df], ignore_index=True)) or True)\n'''
          if old not in s: raise SystemExit('mock de persistencia não encontrado')
          s=s.replace(old,new,1)
          old2='''def test_mesmo_numero_pode_existir_em_unidades_diferentes(monkeypatch):\n    estados = {"UBS A": pd.DataFrame(columns=COLUNAS), "UBS B": pd.DataFrame(columns=COLUNAS)}\n    monkeypatch.setattr(backend, "carregar_dados_excel", lambda unidade: (estados[unidade].copy(), "teste"))\n    monkeypatch.setattr(backend, "salvar_no_excel", lambda df, unidade: estados.__setitem__(unidade, df.copy()) or True)\n    assert backend.registrar_patrimonio("PAT-001", "CPU", "Farmacia", "UBS A", "Dell")\n    assert backend.registrar_patrimonio("PAT-001", "CPU", "Farmacia", "UBS B", "Dell")\n    assert len(estados["UBS A"]) == 1 and len(estados["UBS B"]) == 1\n'''
          new2='''def test_mesmo_numero_nao_pode_existir_em_unidades_diferentes(monkeypatch):\n    estados = {"UBS A": pd.DataFrame(columns=COLUNAS), "UBS B": pd.DataFrame(columns=COLUNAS)}\n    monkeypatch.setattr(backend, "carregar_dados_excel", lambda unidade: (estados[unidade].copy(), "teste"))\n    monkeypatch.setattr(backend, "salvar_no_excel", lambda df, unidade: estados.__setitem__(unidade, df.copy()) or True)\n    planilha = type("Planilha", (), {"worksheets": lambda self: []})()\n    monkeypatch.setattr(backend, "conectar_google_sheets", lambda: planilha)\n    assert backend.registrar_patrimonio("PAT-001", "CPU", "Farmacia", "UBS A", "Dell")\n    class Sheet:\n        def get_all_values(self): return [COLUNAS, ["Farmacia", "CPU", "PAT-001", "Dell", ""]]\n    monkeypatch.setattr(planilha, "worksheets", lambda: [Sheet()])\n    assert not backend.registrar_patrimonio("PAT-001", "CPU", "Farmacia", "UBS B", "Dell")\n'''
          if old2 not in s: raise SystemExit('teste de unidades legado não encontrado')
          s=s.replace(old2,new2,1)
          s=s.replace('backend._aplicar_exclusao_patrimonio(df, "Farmacia", "Nº de Patrimônio")','backend._aplicar_exclusao_patrimonio(df, "Farmacia", "ABC")',1)
          p.write_text(s,encoding='utf-8')
          p=Path('saneamento_dados.py'); s=p.read_text(encoding='utf-8')
          old='normalizado = backend._normalizar_legacy_dataframe(bruto).copy()'
          new='normalizado = backend._normalizar_legacy_dataframe(bruto).copy()\n    if "Tipo de Patrimônio" in normalizado.columns:\n        normalizado["Tipo de Patrimônio"] = normalizado["Tipo de Patrimônio"].map(backend._normalizar_tipo)'
          if old not in s: raise SystemExit('saneamento esperado não encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_inventario_backend.py saneamento_dados.py
          git commit -m 'test: alinhar testes com unicidade global e saneamento canonico'
          git push
      - name: Validar
        run: |
          python -m pip install -q pytest pandas openpyxl streamlit gspread google-auth
          PYTHONPATH=. pytest -q
