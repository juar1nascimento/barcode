name: Inventário GTI SESA - Drive Worker Preflight Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.GTI_SUPABASE_SECRET_KEY }}
    steps:
      - name: Validate worker Drive access without writes
        shell: bash
        run: |
          set -euo pipefail
          http_status="$(curl --silent --show-error --request POST --url "${SUPABASE_URL}/functions/v1/outbox-drive-worker" --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" --header "Content-Type: application/json" --data '{"mode":"validate_drive","limit":1}' --output /tmp/preflight.json --write-out '%{http_code}')"
          echo "HTTP_STATUS=${http_status}"
          cat /tmp/preflight.json
          test "${http_status}" -ge 200 && test "${http_status}" -lt 300
          jq -e '.ok == true and .mode == "validate_drive" and .external_write == false' /tmp/preflight.json
