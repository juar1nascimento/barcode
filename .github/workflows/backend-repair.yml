name: One-time inventory row normalization repair
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove incomplete canonical inventory rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Tabela_de_dados_Inventario_7_2.py')
          s = p.read_text(encoding='utf-8')
          old = '''        for coluna in COLUNAS_INVENTARIO:\n            normalizado[coluna] = normalizado[coluna].map(_valor_texto)\n        return normalizado'''
          new = '''        for coluna in COLUNAS_INVENTARIO:\n            normalizado[coluna] = normalizado[coluna].map(_valor_texto)\n        # Linhas canônicas sem setor, tipo ou número são resíduos inválidos\n        # de versões antigas e não podem voltar para a tabela nem para o Sheets.\n        obrigatorias = ["Setor", "Tipo de Patrimônio", "Nº de Patrimônio"]\n        mask_validos = normalizado[obrigatorias].apply(\n            lambda coluna: coluna.map(lambda valor: not _eh_vazio(valor))\n        ).all(axis=1)\n        return normalizado.loc[mask_validos].reset_index(drop=True)'''
          if old not in s:
              raise SystemExit('Bloco de normalização canônica não encontrado.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q Tabela_de_dados_Inventario_7_2.py
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Tabela_de_dados_Inventario_7_2.py
          git commit -m "Ignorar linhas de inventario incompletas"
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/backend-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/backend-repair.yml
          git commit -m "Remover workflow temporario de normalizacao"
          git push
