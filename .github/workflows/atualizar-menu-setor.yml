name: Atualizar menu Setor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-menu-setor.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar lista fechada de setores
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('sistema_inventario.py')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    opcoes_setor\s*=.*?\n'
              r'(?:    if .*?\n        opcoes_setor\.append\(.*?\)\n)*',
              re.DOTALL,
          )
          new = '''    # IMPORTANTE: o menu de Setor é uma lista fechada e única para todas as UBS/URS.
          # Não é montado a partir dos dados existentes na planilha.
          opcoes_setor = [
              "Consultório",
              "Almoxarifado",
              "Farmacia",
              "Sala de Preparo",
              "Sala de Vacina",
              "Sala de curativo",
              "Gerencia",
              "Administração",
              "Odontologia",
              "Recepção",
              "Outro Setor",
          ]
          '''
          text2, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit('Bloco do menu Setor não foi localizado.')
          text = text2

          branch_pattern = re.compile(
              r'        if setor_selecionado == "Consultório":.*?'
              r'        elif setor_selecionado:\n'
              r'            setor_input = setor_selecionado\n',
              re.DOTALL,
          )
          new_branch = '''        if setor_selecionado == "Consultório":
              setor_input = "Consultório"
          elif setor_selecionado == "Outro Setor":
              setor_input = st.text_input("Nome do Setor:", placeholder="Digite o nome do setor...")
          elif setor_selecionado:
              setor_input = setor_selecionado
          '''
          text2, count = branch_pattern.subn(new_branch, text, count=1)
          if count != 1:
              raise SystemExit('Bloco de tratamento do Setor não foi localizado.')

          path.write_text(text2, encoding='utf-8')
          PY

      - name: Validar sintaxe
        run: python -m py_compile sistema_inventario.py

      - name: Gravar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sistema_inventario.py
          git rm .github/workflows/atualizar-menu-setor.yml
          git commit -m "Fixar lista oficial do menu Setor"
          git push