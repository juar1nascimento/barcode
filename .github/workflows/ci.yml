name: Inventário GTI SESA - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gti-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-test:
    name: Build, tests and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run automated tests
        run: python -m pytest -q
      - name: Dependency security audit
        run: |
          python -m pip install pip-audit==2.9.0 bandit==1.8.6
          pip-audit -r requirements.txt
      - name: Static security audit
        run: bandit -q -r . -x ./tests,./test_*.py --skip B110
      - name: Verify secret leakage
        run: |
          ! git grep -nE 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|postgresql://[^[:space:]]+:[^[:space:]]+@|AIza[0-9A-Za-z_-]{20,}|sb_secret_[A-Za-z0-9_-]+' -- ':!tests/**' ':!.github/workflows/**'
