name: Inventário GTI SESA - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gti-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-test:
    name: Build, tests and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Configure Deno
        uses: denoland/setup-deno@v2.0.3
        with:
          deno-version: v2.x
      - name: Test Drive worker folder safety
        run: deno test supabase/functions/outbox-drive-worker/drive_folder_safety_test.ts
      - name: Validate Drive folder lease migration in disposable PostgreSQL
        if: hashFiles('supabase/migrations/20261013130000_gti_drive_folder_lease.sql') != ''
        run: |
          set -euo pipefail
          docker run -d --rm --name gti-drive-lease-db \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=gti_migration_test \
            -p 5432:5432 postgres:16
          cleanup() { docker stop gti-drive-lease-db >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if docker exec gti-drive-lease-db pg_isready -U postgres -d gti_migration_test >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true

          docker exec -i gti-drive-lease-db psql -U postgres -d gti_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          SQL

          docker exec -i gti-drive-lease-db psql -U postgres -d gti_migration_test -v ON_ERROR_STOP=1 < supabase/migrations/20261013130000_gti_drive_folder_lease.sql

          docker exec -i gti-drive-lease-db psql -U postgres -d gti_migration_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            v_id bigint := 987654321;
            v_token uuid := '11111111-1111-4111-8111-111111111111';
            v_other uuid := '22222222-2222-4222-8222-222222222222';
          BEGIN
            IF NOT public.gti_acquire_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'lease acquisition failed';
            END IF;
            IF public.gti_renew_drive_folder_lease(v_id, v_other, 60) THEN
              RAISE EXCEPTION 'wrong-token renewal accepted';
            END IF;
            IF NOT public.gti_renew_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'valid lease renewal failed';
            END IF;
            IF public.gti_acquire_drive_folder_lease(v_id, v_other, 60) THEN
              RAISE EXCEPTION 'second active lease accepted';
            END IF;
            IF NOT public.gti_release_drive_folder_lease(v_id, v_token) THEN
              RAISE EXCEPTION 'lease release failed';
            END IF;
            IF public.gti_renew_drive_folder_lease(v_id, v_token, 60) THEN
              RAISE EXCEPTION 'renewal after release accepted';
            END IF;
          END
          $test$;

          DO $test$
          DECLARE
            v_id bigint := 987654322;
            v_old uuid := '33333333-3333-4333-8333-333333333333';
            v_new uuid := '44444444-4444-4444-8444-444444444444';
          BEGIN
            IF NOT public.gti_acquire_drive_folder_lease(v_id, v_old, 60) THEN
              RAISE EXCEPTION 'initial lease acquisition failed';
            END IF;
            UPDATE public.gti_drive_folder_leases
               SET lease_until = clock_timestamp() - interval '1 second'
             WHERE patrimonio_id = v_id AND lease_token = v_old;
            IF NOT FOUND THEN RAISE EXCEPTION 'test lease was not expired'; END IF;
            IF NOT public.gti_acquire_drive_folder_lease(v_id, v_new, 60) THEN
              RAISE EXCEPTION 'expired lease could not be reacquired';
            END IF;
            IF public.gti_release_drive_folder_lease(v_id, v_old) THEN
              RAISE EXCEPTION 'former owner released replacement lease';
            END IF;
            IF NOT public.gti_renew_drive_folder_lease(v_id, v_new, 60) THEN
              RAISE EXCEPTION 'replacement lease renewal failed';
            END IF;
            IF NOT public.gti_release_drive_folder_lease(v_id, v_new) THEN
              RAISE EXCEPTION 'replacement lease release failed';
            END IF;
          END
          $test$;

          DO $test$
          BEGIN
            IF has_function_privilege('anon', 'public.gti_acquire_drive_folder_lease(bigint,uuid,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon can execute lease acquisition';
            END IF;
            IF has_function_privilege('authenticated', 'public.gti_renew_drive_folder_lease(bigint,uuid,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated can execute lease renewal';
            END IF;
            IF NOT has_function_privilege('service_role', 'public.gti_renew_drive_folder_lease(bigint,uuid,integer)', 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role cannot renew lease';
            END IF;
          END
          $test$;
          SQL

          docker exec -i gti-drive-lease-db psql -U postgres -d gti_migration_test -v ON_ERROR_STOP=1 < supabase/migrations/20261013130000_gti_drive_folder_lease.sql
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q .
      - name: Run automated tests
        run: python -m pytest -q
      - name: Dependency security audit
        run: |
          python -m pip install pip-audit==2.9.0 bandit==1.8.6
          pip-audit -r requirements.txt
      - name: Static security audit
        run: bandit -q -r . -x ./tests,./test_*.py --skip B110
      - name: Verify secret leakage
        run: |
          ! git grep -nE 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|postgresql://[^[:space:]]+:[^[:space:]]+@|AIza[0-9A-Za-z_-]{20,}|sb_secret_[A-Za-z0-9_-]+' -- ':!tests/**' ':!.github/workflows/**'
