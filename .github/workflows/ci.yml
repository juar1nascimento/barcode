name: Inventário GTI SESA - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Compilar Python
        run: python -m compileall -q .
      - name: Executar testes automatizados
        run: python -m pytest -q
      - name: Verificar vazamento de segredos
        run: |
          ! grep -RInE 'BEGIN (RSA|OPENSSH|PRIVATE) KEY|postgresql://[^[:space:]]+:[^[:space:]]+@'             --exclude-dir=.git --exclude='*.lock' .
