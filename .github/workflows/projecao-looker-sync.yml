name: GTI SESA - Projection for Looker Studio

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: gti-projecao-looker-sync
  cancel-in-progress: false

jobs:
  sync-projecao:
    name: Publish Almoxarifado projection snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GTI_DB_HOST: ${{ secrets.GTI_DB_HOST }}
      GTI_DB_NAME: ${{ secrets.GTI_DB_NAME }}
      GTI_DB_USER: ${{ secrets.GTI_DB_USER }}
      GTI_DB_PASSWORD: ${{ secrets.GTI_DB_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate worker
        run: python -m py_compile projecao_almoxarifado_sheets_worker.py
      - name: Prepare PostgreSQL connection
        run: python scripts/prepare_gti_database.py
      - name: Publish projection snapshot
        run: python projecao_almoxarifado_sheets_worker.py
