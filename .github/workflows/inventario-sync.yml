name: Inventário GTI SESA - sincronização incremental

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: inventario-gti-sesa-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.GTI_DATABASE_URL || secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.GTI_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SHEETS_CREDENTIALS }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GTI_GOOGLE_DRIVE_ROOT_FOLDER_ID || secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID || secrets.GOOGLE_SPREADSHEET_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuração mínima
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL SUPABASE_URL SUPABASE_SECRET_KEY GOOGLE_SHEETS_CREDENTIALS GOOGLE_DRIVE_ROOT_FOLDER_ID GOOGLE_SPREADSHEET_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::Secret ${name} não configurada; sincronização não executada."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configuração incompleta: a sincronização incremental não pode ser considerada bem-sucedida."
            exit 1
          fi

      - name: Validar credencial Google sem expor segredo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          raw = os.environ["GOOGLE_SHEETS_CREDENTIALS"]
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Credencial Google inválida: JSON malformado ({exc.msg}).")

          for field in ("client_email", "private_key"):
              if not str(data.get(field, "")).strip():
                  raise SystemExit(f"Credencial Google inválida: campo obrigatório ausente ({field}).")
          print("Credencial Google validada estruturalmente; conteúdo secreto não será exibido.")
          PY

      - name: Instalar dependências
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar sincronização incremental
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from sincronizador_orquestrador import processar_sincronizacao_incremental

          resultado = processar_sincronizacao_incremental(limit=25)
          print(json.dumps(resultado, ensure_ascii=False))
          if not resultado.get("ok"):
              raise SystemExit(2)
          PY
