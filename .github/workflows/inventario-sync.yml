name: Inventário GTI SESA - sincronização incremental

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: inventario-gti-sesa-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.GTI_DATABASE_URL || secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.GTI_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
      GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SHEETS_CREDENTIALS }}
      GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID || secrets.GOOGLE_SPREADSHEET_ID }}
    steps:
      - name: Checkout
        # Pin de commit imutável; v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Configuração mínima
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL SUPABASE_URL SUPABASE_SECRET_KEY GOOGLE_SHEETS_CREDENTIALS GOOGLE_SPREADSHEET_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::warning::Secret ${name} não configurada; sincronização não executada."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configuração incompleta: a sincronização incremental não pode ser considerada bem-sucedida."
            exit 1
          fi

      - name: Adaptar conexão PostgreSQL para runner IPv4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit

          raw = os.environ["DATABASE_URL"].strip()
          project_ref = "vgabxdprocwmpmhoxrgt"
          direct_host = f"db.{project_ref}.supabase.co"

          # Normaliza hostname DNS entre colchetes sem tocar em senhas ou IPv6.
          if "@" in raw:
              prefix, hostpart = raw.rsplit("@", 1)
              if hostpart.startswith("["):
                  close = hostpart.find("]")
                  candidate = hostpart[1:close] if close > 0 else ""
                  if close > 0 and ":" not in candidate:
                      raw = prefix + "@" + candidate + hostpart[close + 1:]

          parts = urlsplit(raw)
          host = (parts.hostname or "").lower()
          port = parts.port

          if host.endswith(".pooler.supabase.com"):
              # Preserva integralmente o host fornecido pelo Connect do Supabase.
              # O índice do pooler não pode ser inferido a partir da região.
              user = quote(f"postgres.{project_ref}", safe="")
              password = quote(parts.password or "", safe="")
              target_port = 5432 if port in (None, 5432, 6543) else port
              query = urlencode(
                  [
                      (key, value)
                      for key, value in parse_qsl(parts.query, keep_blank_values=True)
                      if key.lower() != "pgbouncer"
                  ]
              )
              adapted = urlunsplit((
                  parts.scheme or "postgresql",
                  f"{user}:{password}@{parts.hostname}:{target_port}",
                  parts.path or "/postgres",
                  query,
                  parts.fragment,
              ))
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                  env.write(f"DATABASE_URL_SYNC={adapted}\n")
              print(f"Supavisor detectado; host preservado e modo sessão em {target_port}.")
          else:
              # Normaliza o endpoint direto conhecido; literais IPv6 permanecem intactos.
              raw = raw.replace(f"[{direct_host}]", direct_host)
              from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit
              parts = urlsplit(raw)
              host = (parts.hostname or "").lower()

              if host == direct_host:
                  # Não inventa o host/índice do Supavisor. Mantém o endpoint fornecido
                  # e deixa a validação de conectividade decidir se ele é utilizável.
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write(f"DATABASE_URL_SYNC={raw}\n")
                  print("Endpoint PostgreSQL direto preservado; nenhuma alteração de host aplicada.")
              else:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                      env.write(f"DATABASE_URL_SYNC={raw}\n")
                  print("Conexão PostgreSQL já está adequada para o runner; nenhuma alteração aplicada.")
          PY

      - name: Instalar dependências
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Validar conexão PostgreSQL sem expor segredo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import psycopg
          from psycopg.conninfo import conninfo_to_dict, make_conninfo

          url = os.environ["DATABASE_URL_SYNC"]
          project_ref = "vgabxdprocwmpmhoxrgt"
          params = conninfo_to_dict(url)
          params["user"] = "postgres." + project_ref
          params["port"] = 5432
          params.pop("pgbouncer", None)
          url = make_conninfo(**params)
          host = "supabase-postgres"
          try:
              with psycopg.connect(url, connect_timeout=10) as conn:
                  with conn.cursor() as cur:
                      cur.execute("select 1")
                      if cur.fetchone() != (1,):
                          raise RuntimeError("teste SQL não retornou o valor esperado")
              print(f"Conexão PostgreSQL validada: {host}")
          except Exception as exc:
              print(f"Falha de conectividade PostgreSQL em {host}: {type(exc).__name__}.")
              raise
          PY

      - name: Validar credencial Google sem expor segredo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          raw = os.environ["GOOGLE_SHEETS_CREDENTIALS"]
          try:
              data = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Credencial Google inválida: JSON malformado ({exc.msg}).")

          for field in ("client_email", "private_key"):
              if not str(data.get(field, "")).strip():
                  raise SystemExit(f"Credencial Google inválida: campo obrigatório ausente ({field}).")
          print("Credencial Google validada estruturalmente; conteúdo secreto não será exibido.")
          PY

      - name: Preparar configuração efêmera do Google Sheets para CI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .streamlit
          python - <<'PY'
          import json
          import os
          import toml

          credencial = json.loads(os.environ["GOOGLE_SHEETS_CREDENTIALS"])
          spreadsheet_id = os.environ.get("GOOGLE_SPREADSHEET_ID", "").strip()
          dados = {"gcp_service_account": credencial}
          if spreadsheet_id:
              dados["spreadsheet_id"] = spreadsheet_id
          with open(".streamlit/secrets.toml", "w", encoding="utf-8") as arquivo:
              arquivo.write(toml.dumps(dados))
          print("Configuração efêmera do Google Sheets preparada sem exibir credenciais.")
          PY

      - name: Executar sincronização incremental
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          project_ref = "vgabxdprocwmpmhoxrgt"
          from psycopg.conninfo import conninfo_to_dict, make_conninfo
          url = os.environ["DATABASE_URL_SYNC"]
          params = conninfo_to_dict(url)
          params["user"] = "postgres." + project_ref
          params["port"] = 5432
          params.pop("pgbouncer", None)
          os.environ["DATABASE_URL"] = make_conninfo(**params)
          from sincronizador_orquestrador import processar_sincronizacao_incremental

          resultado = processar_sincronizacao_incremental(limit=25)
          print(json.dumps(resultado, ensure_ascii=False))
          if not resultado.get("ok"):
              raise SystemExit(2)
          PY
