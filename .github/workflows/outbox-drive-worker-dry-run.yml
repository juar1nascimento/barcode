name: Inventário GTI SESA - Drive Worker Dry Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gti-drive-worker-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    name: Validate Drive outbox worker without writes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.GTI_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.GTI_SUPABASE_SECRET_KEY }}
    steps:
      - name: Validate required secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_URL}" || {
            echo "::error::GTI_SUPABASE_URL não configurado."
            exit 1
          }
          case "${SUPABASE_URL}" in
            https://*.supabase.co) ;;
            *) echo "::error::GTI_SUPABASE_URL inválido."; exit 1 ;;
          esac
          test -n "${SUPABASE_SECRET_KEY}" || {
            echo "::error::GTI_SUPABASE_SECRET_KEY não configurado."
            exit 1
          }
          case "${SUPABASE_SECRET_KEY}" in
            sb_secret_*) ;;
            *) echo "::error::GTI_SUPABASE_SECRET_KEY não está no formato esperado."; exit 1 ;;
          esac

      - name: Invoke worker in dry-run mode
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "${SUPABASE_URL}/functions/v1/outbox-drive-worker" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Content-Type: application/json" \
            --data '{"mode":"dry_run","limit":1}' \
            --output /tmp/worker-response.json
          cat /tmp/worker-response.json
