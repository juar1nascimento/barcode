name: Sincronizacao de patrimonios com Google Sheets

on:
  workflow_dispatch:
  push:
    paths:
      - "inventario_sheets_outbox_worker.py"
      - "supabase/migrations/*patrimonios_google_sheets_outbox.sql"
      - ".github/workflows/inventario-sheets-outbox.yml"
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: gti-sheets-inventory-outbox
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install psycopg[binary]==3.2.10 gspread==5.12.4 google-auth==2.57.0

      - name: Processar outbox
        env:
          DATABASE_URL: ${{ secrets.GTI_DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GTI_GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GTI_GOOGLE_SPREADSHEET_ID }}
          OUTBOX_BATCH_SIZE: "20"
          OUTBOX_MAX_ATTEMPTS: "8"
        run: python inventario_sheets_outbox_worker.py

      - name: Relatar resultado
        if: always()
        run: echo "Worker de patrimonios finalizado. Consulte os logs para quantidade processada e falhas."
